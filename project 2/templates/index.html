<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice Assistant · 3D</title>

<style>
  :root {
    --bg-0: #03040a;
    --bg-1: #0a0d20;
    --purple-1: #b38bff;
    --purple-2: #7c5cff;
    --cyan-1: #4ee0c8;
    --cyan-2: #2ab8d4;
    --blue-1: #6aa6ff;
    --blue-2: #4a7cff;
    --pink-1: #ff4d7d;
    --pink-2: #ff8a5c;
    --gold: #ffcb6b;
    --panel: rgba(20, 24, 48, 0.55);
    --panel-brd: rgba(140, 170, 255, 0.22);
    --text: #eef2ff;
    --muted: #8d97b5;
    --user: #7fe3ff;
    --bot: #c9b8ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
    color: var(--text);
    background: var(--bg-1);
    min-height: 100vh;
    overflow-x: hidden;
    perspective: 1400px;
  }

  /* ---------- Background ---------- */
  .bg-anim {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(1200px 700px at 15% -10%, #2a1b5c 0%, transparent 55%),
      radial-gradient(900px 600px at 90% 10%, #0c2a4a 0%, transparent 55%),
      radial-gradient(1100px 700px at 50% 110%, #3a1a4a 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-1), var(--bg-0));
    transition: filter .8s ease;
  }
  body.listening .bg-anim { filter: hue-rotate(-30deg) brightness(1.15) saturate(1.3); }
  body.speaking  .bg-anim { filter: hue-rotate(40deg)  brightness(1.1) saturate(1.25); }

  .grid-bg {
    position: fixed; inset: -10%; z-index: 0;
    background-image:
      linear-gradient(rgba(124, 92, 255, 0.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(78, 224, 200, 0.08) 1px, transparent 1px);
    background-size: 60px 60px, 60px 60px;
    transform: perspective(600px) rotateX(60deg) translateZ(-200px);
    animation: gridMove 20s linear infinite;
    pointer-events: none;
    mask-image: radial-gradient(circle at 50% 40%, black 0%, transparent 75%);
  }
  @keyframes gridMove {
    from { background-position: 0 0, 0 0; }
    to   { background-position: 0 60px, 60px 0; }
  }

  .orb-canvas, .particles {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
  }
  .orb-canvas { opacity: 0.9; mix-blend-mode: screen; }

  /* ---------- Layout ---------- */
  .wrap {
    position: relative; z-index: 2;
    max-width: 880px; margin: 0 auto;
    padding: 2rem 1.25rem 3rem;
    display: flex; flex-direction: column; gap: 1rem;
    min-height: 100vh;
  }

  header { text-align: center; animation: floatIn 1s cubic-bezier(.2,.8,.2,1) both; }
  h1 {
    margin: 0;
    font-size: clamp(1.7rem, 3.4vw, 2.5rem);
    font-weight: 800; letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--purple-1), var(--blue-1), var(--cyan-1), var(--gold), var(--pink-1));
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 30px rgba(124, 92, 255, 0.4));
    animation: gradientShift 6s ease-in-out infinite;
  }
  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }
  .sub { margin-top: 0.5rem; color: var(--muted); font-size: 0.92rem; }
  @keyframes floatIn {
    from { opacity: 0; transform: translateY(18px) rotateX(-12deg); }
    to   { opacity: 1; transform: translateY(0) rotateX(0); }
  }

  /* ---------- Chat card ---------- */
  .card {
    position: relative;
    border-radius: 22px;
    background: var(--panel);
    border: 1px solid var(--panel-brd);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow:
      0 30px 60px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.06),
      0 0 60px rgba(124, 92, 255, 0.35);
    transform-style: preserve-3d;
    transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .3s;
    will-change: transform;
    overflow: hidden;
    animation: cardIn 1.1s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) rotateX(10deg) scale(.98); }
    to   { opacity: 1; transform: translateY(0)   rotateX(0)    scale(1); }
  }
  .card::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.08) 50%, transparent 70%);
    transform: translateX(-100%);
    animation: sheen 6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes sheen {
    0%, 70%, 100% { transform: translateX(-100%); }
    85%           { transform: translateX(100%); }
  }

  .chat {
    height: min(48vh, 440px);
    overflow-y: auto;
    padding: 1.1rem 1.1rem 1.25rem;
    display: flex; flex-direction: column; gap: 0.65rem;
    scroll-behavior: smooth;
  }
  .chat::-webkit-scrollbar { width: 8px; }
  .chat::-webkit-scrollbar-thumb {
    background: linear-gradient(var(--purple-1), var(--cyan-1));
    border-radius: 999px;
  }
  .chat::-webkit-scrollbar-track { background: transparent; }

  .msg {
    max-width: 78%;
    padding: 0.7rem 1rem;
    border-radius: 14px;
    line-height: 1.45;
    font-size: 0.96rem;
    word-wrap: break-word;
    transform-origin: center bottom;
    animation: popIn .35s cubic-bezier(.2,.9,.3,1.4) both;
    will-change: transform;
  }
  @keyframes popIn {
    from { opacity: 0; transform: translateY(10px) scale(.96) rotateX(-8deg); }
    to   { opacity: 1; transform: translateY(0)    scale(1)   rotateX(0); }
  }
  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, #1a3a5e, #0f2c4d);
    color: var(--user);
    border: 1px solid rgba(127,227,255,0.3);
    box-shadow: 0 8px 24px rgba(127,227,255,0.15);
  }
  .msg.bot {
    align-self: flex-start;
    background: linear-gradient(135deg, #2a1f52, #1c1a3a);
    color: var(--bot);
    border: 1px solid rgba(201,184,255,0.22);
    box-shadow: 0 8px 24px rgba(124,92,255,0.18);
  }
  .msg.sys {
    align-self: center; background: transparent;
    color: var(--muted); font-size: 0.82rem; font-style: italic;
  }
  .msg a { color: var(--cyan-1); }

  /* ---------- Controls ---------- */
  .controls {
    display: flex; gap: 0.65rem; align-items: center;
    transform-style: preserve-3d;
  }
  input[type="text"] {
    flex: 1;
    padding: 0.95rem 1.1rem;
    border-radius: 14px;
    border: 1px solid var(--panel-brd);
    background: rgba(10, 14, 30, 0.75);
    color: var(--text);
    font-size: 1rem; outline: none;
    transition: transform .2s, border-color .2s, box-shadow .2s;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
  }
  input[type="text"]::placeholder { color: #586a92; }
  input[type="text"]:focus {
    border-color: rgba(124, 92, 255, 0.7);
    box-shadow: 0 0 0 4px rgba(124, 92, 255, 0.15), 0 0 30px rgba(124, 92, 255, 0.25);
    transform: translateY(-1px);
  }

  #sendBtn {
    padding: 0 1.4rem;
    height: 48px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.12);
    background: linear-gradient(135deg, var(--purple-2), var(--blue-2));
    color: white;
    font-size: 1rem; font-weight: 700;
    cursor: pointer;
    transition: transform .15s cubic-bezier(.2,.9,.3,1.4), box-shadow .25s, filter .2s;
    box-shadow: 0 10px 24px rgba(124,92,255,0.45), inset 0 1px 0 rgba(255,255,255,0.35);
    user-select: none;
  }
  #sendBtn:hover {
    transform: translateY(-3px) rotateX(6deg) scale(1.04);
    filter: brightness(1.1);
    box-shadow: 0 14px 32px rgba(124,92,255,0.6), 0 0 40px rgba(124,92,255,0.5);
  }
  #sendBtn:active { transform: translateY(0) scale(.97); }

  /* ---------- 3D MIC ---------- */
  .mic-wrap {
    position: relative;
    width: 72px; height: 72px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  #micBtn {
    position: relative;
    width: 100%; height: 100%;
    padding: 0;
    border-radius: 50%;
    border: none;
    background: radial-gradient(circle at 30% 30%, #c9b8ff, #7c5cff 55%, #4a2ba0);
    color: white;
    font-size: 1.7rem;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow:
      0 10px 30px rgba(124,92,255,0.55),
      0 0 70px rgba(124,92,255,0.45),
      inset 0 2px 4px rgba(255,255,255,0.5),
      inset 0 -8px 14px rgba(0,0,0,0.4);
    transition: transform .25s cubic-bezier(.2,.9,.3,1.4), box-shadow .3s, background .3s;
    z-index: 2;
    animation: micFloat 4s ease-in-out infinite;
  }
  @keyframes micFloat {
    0%, 100% { transform: translateY(0)    scale(1); }
    50%      { transform: translateY(-5px) scale(1.03); }
  }
  #micBtn:hover {
    transform: translateY(-7px) scale(1.1);
    box-shadow:
      0 16px 40px rgba(124,92,255,0.7),
      0 0 100px rgba(124,92,255,0.6),
      inset 0 2px 4px rgba(255,255,255,0.55),
      inset 0 -8px 14px rgba(0,0,0,0.4);
  }
  #micBtn:active { transform: translateY(-2px) scale(.95); }

  .mic-ring {
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(124,92,255,0.55);
    pointer-events: none;
    opacity: 0;
  }
  body.listening .mic-ring { animation: ringPulse 1.8s ease-out infinite; }
  .mic-ring:nth-of-type(1) { animation-delay: 0s;   }
  .mic-ring:nth-of-type(2) { animation-delay: 0.5s; }
  .mic-ring:nth-of-type(3) { animation-delay: 1.0s; }
  @keyframes ringPulse {
    0%   { opacity: 0.9; transform: scale(1);   border-color: rgba(255,77,125,0.7); }
    100% { opacity: 0;   transform: scale(2.1); border-color: rgba(255,77,125,0); }
  }

  body.listening #micBtn {
    background: radial-gradient(circle at 30% 30%, #ffb1c4, #ff4d7d 55%, #a01848);
    box-shadow:
      0 10px 30px rgba(255,77,125,0.65),
      0 0 100px rgba(255,77,125,0.55),
      inset 0 2px 4px rgba(255,255,255,0.5),
      inset 0 -8px 14px rgba(0,0,0,0.4);
    animation: micListening 1.2s ease-in-out infinite;
  }
  @keyframes micListening {
    0%, 100% { transform: scale(1);    }
    50%      { transform: scale(1.1); }
  }
  body.speaking #micBtn {
    background: radial-gradient(circle at 30% 30%, #b6f7e8, #4ee0c8 55%, #1e8b78);
    box-shadow:
      0 10px 30px rgba(78,224,200,0.6),
      0 0 100px rgba(78,224,200,0.55),
      inset 0 2px 4px rgba(255,255,255,0.5),
      inset 0 -8px 14px rgba(0,0,0,0.4);
  }

  .voice-meter {
    position: absolute;
    bottom: -16px; left: 50%;
    transform: translateX(-50%);
    width: 90px; height: 4px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
    opacity: 0;
    transition: opacity .3s;
  }
  body.listening .voice-meter { opacity: 1; }
  .voice-meter-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--pink-1), var(--pink-2), var(--gold));
    border-radius: 999px;
    transition: width 0.08s linear;
    box-shadow: 0 0 14px rgba(255,138,92,0.9);
  }

  /* ---------- THINKING INDICATOR ---------- */
  .thinking {
    display: none;
    align-self: center;
    align-items: center;
    gap: 0.6rem;
    padding: 0.7rem 1.3rem;
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(124,92,255,0.4), rgba(78,224,200,0.3));
    border: 1px solid rgba(124,92,255,0.7);
    color: #e8dcff;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-shadow: 0 0 12px rgba(124,92,255,0.8);
    box-shadow:
      0 0 24px rgba(124,92,255,0.55),
      0 0 48px rgba(78,224,200,0.35),
      inset 0 1px 0 rgba(255,255,255,0.2);
    animation: thinkingGlow 2s ease-in-out infinite;
    position: relative;
    overflow: hidden;
    margin-top: -0.25rem;
  }
  .thinking.visible { display: inline-flex; }

  .thinking::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(255,255,255,0.25) 50%,
      transparent 100%);
    transform: translateX(-100%);
    animation: thinkingSweep 1.6s ease-in-out infinite;
  }

  @keyframes thinkingGlow {
    0%, 100% {
      box-shadow:
        0 0 24px rgba(124,92,255,0.55),
        0 0 48px rgba(78,224,200,0.35),
        inset 0 1px 0 rgba(255,255,255,0.2);
      border-color: rgba(124,92,255,0.7);
    }
    50% {
      box-shadow:
        0 0 36px rgba(78,224,200,0.7),
        0 0 72px rgba(78,224,200,0.45),
        inset 0 1px 0 rgba(255,255,255,0.25);
      border-color: rgba(78,224,200,0.95);
    }
  }
  @keyframes thinkingSweep {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .thinking-dots { display: inline-flex; gap: 4px; }
  .thinking-dots span {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: linear-gradient(135deg, #d9c9ff, #9ff5e0);
    animation: thinkingBounce 1.2s ease-in-out infinite;
    box-shadow: 0 0 10px rgba(124,92,255,0.9);
  }
  .thinking-dots span:nth-child(2) { animation-delay: 0.15s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes thinkingBounce {
    0%, 60%, 100% { transform: translateY(0)    scale(1);    opacity: 0.7; }
    30%           { transform: translateY(-6px) scale(1.15); opacity: 1; }
  }

  .status {
    text-align: center;
    min-height: 1.3em;
    font-size: 0.86rem;
    color: var(--muted);
    transition: color .2s;
  }
  .warn { color: var(--gold); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
    .grid-bg, .bg-anim { animation: none; }
  }
</style>
</head>
<body>

  <div class="bg-anim"></div>
  <div class="grid-bg"></div>
  <canvas class="orb-canvas" id="orb"></canvas>
  <canvas class="particles" id="particles"></canvas>

  <div class="wrap">
    <header>
      <h1>🎙️ Voice Assistant</h1>
      <div class="sub">Speak or type · powered by real-time 3D</div>
    </header>

    <div class="card" id="card">
      <div class="chat" id="chat"></div>
    </div>

    <div class="thinking" id="thinking">
      <div class="thinking-dots"><span></span><span></span><span></span></div>
      <span>Thinking</span>
    </div>

    <div class="controls">
      <input id="textInput" type="text" placeholder="Type a command and press Enter…" autocomplete="off" />
      <button id="sendBtn" type="button">Send</button>
      <div class="mic-wrap">
        <button id="micBtn" type="button" title="Click to start listening">🎤</button>
        <span class="mic-ring"></span>
        <span class="mic-ring"></span>
        <span class="mic-ring"></span>
        <div class="voice-meter"><div class="voice-meter-fill" id="voiceMeterFill"></div></div>
      </div>
    </div>

    <div class="status" id="status"></div>
  </div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
  "use strict";

  const orbState = { listening: false, speaking: false, energy: 0 };

  /* ============================================================
     3D ORB
     ============================================================ */
  function initOrb() {
    const canvas = document.getElementById("orb");
    if (!window.THREE) return;
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 6.5);

    const mat = new THREE.MeshBasicMaterial({ color: 0x7c5cff, wireframe: true, transparent: true, opacity: 0.5 });
    const orb = new THREE.Mesh(new THREE.IcosahedronGeometry(2.1, 2), mat);
    scene.add(orb);

    const innerMat = new THREE.MeshBasicMaterial({ color: 0xb38bff, transparent: true, opacity: 0.12 });
    const inner = new THREE.Mesh(new THREE.IcosahedronGeometry(1.55, 1), innerMat);
    scene.add(inner);

    const haloMat = new THREE.MeshBasicMaterial({ color: 0x4ee0c8, wireframe: true, transparent: true, opacity: 0.22 });
    const halo = new THREE.Mesh(new THREE.IcosahedronGeometry(2.8, 1), haloMat);
    scene.add(halo);

    const count = 900;
    const positions = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      const r = 2.6 + Math.random() * 2.4;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
      positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta) * 0.5;
      positions[i*3+2] = r * Math.cos(phi);
    }
    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    const ring = new THREE.Points(pGeo, new THREE.PointsMaterial({ color: 0x9fd0ff, size: 0.03, transparent: true, opacity: 0.8 }));
    scene.add(ring);

    const mouse = { x: 0, y: 0 };
    window.addEventListener("mousemove", (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = (e.clientY / window.innerHeight) * 2 - 1;
    });

    let t = 0;
    function animate() {
      requestAnimationFrame(animate);
      t += 0.006;
      const e = orbState.energy;
      const speed = 1 + e * 3;
      orb.rotation.y += 0.003 * speed;
      orb.rotation.x += 0.0015 * speed;
      inner.rotation.y -= 0.002 * speed;
      halo.rotation.y += 0.0012 * speed;
      halo.rotation.z += 0.0008 * speed;
      ring.rotation.y += 0.0015 * speed;
      ring.rotation.x = Math.sin(t * 0.4) * 0.15;
      const pulse = 1 + Math.sin(t * 6) * 0.015 + e * 0.10;
      orb.scale.setScalar(pulse);
      inner.scale.setScalar(1 + e * 0.08);
      halo.scale.setScalar(1 + e * 0.05);

      if (orbState.listening) {
        mat.color.lerp(new THREE.Color(0xff4d7d), 0.05);
        innerMat.color.lerp(new THREE.Color(0xff8a5c), 0.05);
      } else if (orbState.speaking) {
        mat.color.lerp(new THREE.Color(0x4ee0c8), 0.05);
        innerMat.color.lerp(new THREE.Color(0x6aa6ff), 0.05);
      } else {
        mat.color.lerp(new THREE.Color(0x7c5cff), 0.05);
        innerMat.color.lerp(new THREE.Color(0xb38bff), 0.05);
      }

      camera.position.x += (mouse.x * 0.9 - camera.position.x) * 0.03;
      camera.position.y += (-mouse.y * 0.6 - camera.position.y) * 0.03;
      camera.lookAt(0, 0, 0);
      renderer.render(scene, camera);
    }
    animate();
    window.addEventListener("resize", () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });
  }
  initOrb();

  /* ============================================================
     PARTICLES
     ============================================================ */
  function initParticles() {
    const c = document.getElementById("particles");
    const ctx = c.getContext("2d");
    let w, h, parts;
    const mouse = { x: -9999, y: -9999 };

    function resize() {
      w = c.width  = window.innerWidth;
      h = c.height = window.innerHeight;
      parts = Array.from({ length: 90 }, () => ({
        x: Math.random() * w, y: Math.random() * h,
        r: Math.random() * 1.8 + 0.4,
        vx: (Math.random() - 0.5) * 0.2,
        vy: (Math.random() - 0.5) * 0.2,
        a: Math.random() * 0.5 + 0.15,
      }));
    }
    resize();
    window.addEventListener("resize", resize);
    window.addEventListener("mousemove", (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });

    function tick() {
      requestAnimationFrame(tick);
      ctx.clearRect(0, 0, w, h);
      for (const p of parts) {
        const dx = mouse.x - p.x, dy = mouse.y - p.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 200 && dist > 1) {
          p.vx += (dx / dist) * 0.012;
          p.vy += (dy / dist) * 0.012;
        }
        p.vx *= 0.98; p.vy *= 0.98;
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
        if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(180, 200, 255, ${p.a})`;
        ctx.fill();
      }
    }
    tick();
  }
  initParticles();

  /* ============================================================
     CARD TILT
     ============================================================ */
  function initTilt() {
    const card = document.getElementById("card");
    const max = 6;
    let raf = null;
    card.addEventListener("mousemove", (e) => {
      const r = card.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width  - 0.5;
      const py = (e.clientY - r.top)  / r.height - 0.5;
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        card.style.transform = `rotateY(${px * max}deg) rotateX(${-py * max}deg) translateZ(0)`;
      });
    });
    card.addEventListener("mouseleave", () => { card.style.transform = ""; });
  }
  initTilt();

  /* ============================================================
     CHAT + BACKEND
     ============================================================ */
  const chatEl     = document.getElementById("chat");
  const inputEl    = document.getElementById("textInput");
  const sendBtn    = document.getElementById("sendBtn");
  const micBtn     = document.getElementById("micBtn");
  const statusEl   = document.getElementById("status");
  const meterFill  = document.getElementById("voiceMeterFill");
  const thinkingEl = document.getElementById("thinking");

  let ws = null;
  let audioContext = null;
  let micStream = null;
  let micProcessor = null;
  let analyser = null;
  let isStreaming = false;
  let playContext = null;

  function addMsg(text, cls) {
    const div = document.createElement("div");
    div.className = `msg ${cls}`;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  function setStatus(msg, warn = false) {
    statusEl.textContent = msg;
    statusEl.className = "status" + (warn ? " warn" : "");
  }

  function showThinking() { thinkingEl.classList.add("visible"); }
  function hideThinking() { thinkingEl.classList.remove("visible"); }

  /* ---------- Play PCM from Deepgram ---------- */
  function playPcmChunk(base64Data) {
    try {
      const bytes = Uint8Array.from(atob(base64Data), c => c.charCodeAt(0));
      const pcm16 = new Int16Array(bytes.buffer);
      const float32 = new Float32Array(pcm16.length);
      for (let i = 0; i < pcm16.length; i++) float32[i] = pcm16[i] / 32768;

      if (!playContext) playContext = new (window.AudioContext || window.webkitAudioContext)();
      const buffer = playContext.createBuffer(1, float32.length, 24000);
      buffer.copyToChannel(float32, 0);
      const source = playContext.createBufferSource();
      source.buffer = buffer;
      source.connect(playContext.destination);
      source.start();

      orbState.speaking = true;
      orbState.energy = 0.9;
      document.body.classList.add("speaking");
      hideThinking();

      source.onended = () => {
        orbState.speaking = false;
        orbState.energy = 0.0;
        document.body.classList.remove("speaking");
      };
    } catch (e) {
      console.warn("audio playback failed:", e);
    }
  }

  /* ---------- Start live streaming ---------- */
  async function startStreaming() {
    if (isStreaming) return;
    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true }
      });
    } catch (e) {
      setStatus("Microphone access denied.", true);
      return;
    }

    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioContext.createMediaStreamSource(micStream);

    analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);
    const dataArray = new Uint8Array(analyser.frequencyBinCount);
    function updateMeter() {
      if (!analyser || !isStreaming) return;
      analyser.getByteFrequencyData(dataArray);
      let sum = 0;
      for (const v of dataArray) sum += v;
      const level = Math.min(100, (sum / dataArray.length) * 2);
      if (meterFill) meterFill.style.width = level + "%";
      orbState.energy = 0.4 + (level / 100) * 0.5;
      requestAnimationFrame(updateMeter);
    }
    updateMeter();

    micProcessor = audioContext.createScriptProcessor(4096, 1, 1);

    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(`${proto}//${location.host}/ws/voice`);

    ws.onopen = () => {
      isStreaming = true;
      orbState.listening = true;
      orbState.energy = 0.8;
      micBtn.classList.add("listening");
      micBtn.textContent = "⏹";
      document.body.classList.add("listening");
      setStatus("🎤 Live — speak naturally. Click ⏹ to stop.");
      addMsg("Live voice session started. I'm listening…", "sys");

      micProcessor.onaudioprocess = (e) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        const input = e.inputBuffer.getChannelData(0);
        const pcm16 = new Int16Array(input.length);
        for (let i = 0; i < input.length; i++) {
          pcm16[i] = Math.max(-1, Math.min(1, input[i])) * 0x7FFF;
        }
        const b64 = btoa(String.fromCharCode(...new Uint8Array(pcm16.buffer)));
        ws.send(JSON.stringify({ type: "audio", data: b64 }));
      };

      source.connect(micProcessor);
      micProcessor.connect(audioContext.destination);
    };

    ws.onmessage = (event) => {
      let msg;
      try { msg = JSON.parse(event.data); } catch { return; }

      if (msg.type === "connected") {
        setStatus("🎤 Connected. Speak now.");
      } else if (msg.type === "audio") {
        playPcmChunk(msg.data);
      } else if (msg.type === "deepgram_event") {
        if (msg.transcript && msg.role === "user") {
          addMsg(msg.transcript, "user");
          showThinking();
        } else if (msg.content && msg.role === "assistant") {
          hideThinking();
          addMsg(msg.content, "bot");
        }
      } else if (msg.type === "error") {
        hideThinking();
        addMsg(`Error: ${msg.message}`, "bot");
        setStatus("Error occurred.", true);
        stopStreaming();
      }
    };

    ws.onerror = () => { setStatus("WebSocket error.", true); stopStreaming(); };
    ws.onclose = () => { stopStreaming(); };
  }

  function stopStreaming() {
    isStreaming = false;
    orbState.listening = false;
    orbState.energy = 0.0;
    document.body.classList.remove("listening");
    document.body.classList.remove("speaking");
    hideThinking();

    if (ws) { try { ws.send(JSON.stringify({ type: "stop" })); ws.close(); } catch {} ws = null; }
    if (micProcessor) { micProcessor.disconnect(); micProcessor = null; }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    if (analyser) { analyser = null; }
    if (meterFill) meterFill.style.width = "0%";

    micBtn.classList.remove("listening");
    micBtn.textContent = "🎤";
    setStatus("Ready.");
  }

  /* ---------- Typed input: Send + Enter both work ---------- */
  async function sendText(cmd) {
    if (!cmd || !cmd.trim()) return;
    addMsg(cmd, "user");
    showThinking();
    setStatus("Thinking…");

    try {
      const res = await fetch("/api/command", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ command: cmd }),
      });
      const data = await res.json();

      hideThinking();
      addMsg(data.text, "bot");
      if (data.open_url) window.open(data.open_url, "_blank", "noopener");
      setStatus(data.exit ? "Session ended." : "Ready.");
    } catch (e) {
      console.error(e);
      hideThinking();
      addMsg("Network error.", "bot");
      setStatus("Network error.", true);
    }
  }

  // Send button
  sendBtn.addEventListener("click", () => {
    const v = inputEl.value;
    inputEl.value = "";
    sendText(v);
  });

  // Enter key
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      const v = inputEl.value;
      inputEl.value = "";
      sendText(v);
    }
  });

  // Mic toggle
  micBtn.addEventListener("click", () => {
    if (isStreaming) stopStreaming();
    else startStreaming();
  });

  // KB reload helper
  window.reloadKB = async () => {
    const r = await fetch("/api/reload", { method: "POST" });
    const j = await r.json();
    console.log("Reloaded", j.intents, "intents");
    return j;
  };

  addMsg("Hi! Click 🎤 to start a live voice session, or type and press Enter.", "bot");
  setStatus("Ready. Click 🎤 or type to begin.");
})();
</script>
</body>
</html>
